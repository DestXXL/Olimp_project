version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tramplin-postgres
    environment:
      POSTGRES_USER: tramplin
      POSTGRES_PASSWORD: tramplin123
      POSTGRES_DB: tramplin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tramplin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tramplin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
